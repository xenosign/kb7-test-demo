services:
  mysql:
    image: mysql:8.0
    container_name: kb7-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: kb7demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo1234
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/02-generate-data.sql:/docker-entrypoint-initdb.d/02-generate-data.sql

  redis:
    image: redis:7
    container_name: kb7-redis
    restart: unless-stopped
    ports:
      # 로컬에 이미 6379로 떠있는 다른 redis-server(네이티브 Windows 프로세스)와 충돌을 피하기 위해
      # 호스트 포트를 16379로 매핑한다.
      - "16379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: kb7-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    container_name: kb7-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning

volumes:
  mysql-data:
  grafana-data:
