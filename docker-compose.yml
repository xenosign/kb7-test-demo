services:
  mysql:
    image: mysql:8.0
    container_name: kb7-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root1234
      MYSQL_DATABASE: kb7demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo1234
    ports:
      - "13306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/01-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/02-generate-data.sql:/docker-entrypoint-initdb.d/02-generate-data.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot1234"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7
    container_name: kb7-redis
    restart: unless-stopped
    ports:
      # 로컬에 이미 6379로 떠있는 다른 redis-server(네이티브 Windows 프로세스)와 충돌을 피하기 위해
      # 호스트 포트를 16379로 매핑한다.
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kb7-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      # 컨테이너 내부에서는 host 포트(13306/16379)가 아니라 docker 네트워크 안의
      # 서비스 이름과 기본 포트로 접속한다.
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/kb7demo
      SPRING_DATASOURCE_USERNAME: demo
      SPRING_DATASOURCE_PASSWORD: demo1234
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"

  influxdb:
    image: influxdb:1.8
    container_name: kb7-influxdb
    restart: unless-stopped
    ports:
      - "8086:8086"
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    volumes:
      - influxdb-data:/var/lib/influxdb

  prometheus:
    image: prom/prometheus:latest
    container_name: kb7-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      # k6가 --out experimental-prometheus-rw 로 보내는 remote-write 요청을 받기 위해 필요.
      - "--web.enable-remote-write-receiver"

  grafana:
    image: grafana/grafana:latest
    container_name: kb7-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - influxdb
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning

volumes:
  mysql-data:
  grafana-data:
  influxdb-data:
