global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'kb7-test-demo'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # 앱은 컨테이너가 아니라 호스트(로컬)에서 gradlew bootRun으로 실행하므로
      # 컨테이너에서 호스트로 접근하기 위해 host.docker.internal을 사용한다.
      - targets: ['host.docker.internal:8080']
