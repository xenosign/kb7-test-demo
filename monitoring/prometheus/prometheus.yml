global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'kb7-test-demo'
    metrics_path: '/actuator/prometheus'
    static_configs:
      # app: docker-compose의 app 서비스(기본 실행 방식).
      # host.docker.internal: gradlew bootRun으로 호스트에서 직접 띄운 경우를 위한 폴백.
      # 둘 중 실행 중이지 않은 쪽은 그냥 scrape 실패(target down)로 표시될 뿐 문제 없다.
      - targets: ['app:8080', 'host.docker.internal:8080']
